version: 3.1.0
package_schema: schemas/package-manifest.v3.json
receipt_schema: schemas/install-receipt.v1.json
entrypoints:
  persona: PERSONA.md
  spec: SPEC.md
  skill: skills/*/SKILL.md
forbidden_package_paths:
  - agent.md
  - EIDOLONS.md
adapter_types:
  - symlink
  - pointer
hook_events:
  - session-start
  - prompt-submit
  - pre-tool
  - stop
pointer_contract:
  max_bytes: 2048
  required_marker: "generated_by: eidolons"
  forbidden_markers:
    - "<!-- eidolon:"
package_roles:
  - persona
  - spec
  - skill
  - resource
  - hook
host_adapter_paths:
  claude-code:
    agents: .claude/agents/<name>.md
    skills: .claude/skills/<name>-<skill>/SKILL.md
  cursor:
    rules: .cursor/rules/<name>.mdc
    agents: .cursor/agents/<name>.md
    skills: .cursor/skills/<name>-<skill>/SKILL.md
  codex:
    agents: .codex/agents/<name>.toml
  copilot:
    agents: .github/agents/<name>.agent.md
  opencode:
    agents: .opencode/agents/<name>.md
