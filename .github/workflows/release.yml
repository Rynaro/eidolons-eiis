# Tag-driven release: produces a GitHub Release with the spec file and
# a tarball of the conformance checker.
name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq

      - name: Verify EIIS_VERSION matches tag
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          eiis_ver="$(cat EIIS_VERSION | tr -d '[:space:]')"
          # Agree on MAJOR.MINOR whether EIIS_VERSION is X.Y or X.Y.Z.
          tag_xy="$(echo "$tag" | awk -F. '{print $1"."$2}')"
          eiis_xy="$(echo "$eiis_ver" | awk -F. '{print $1"."$2}')"
          if [ "$tag_xy" != "$eiis_xy" ]; then
            echo "Tag MAJOR.MINOR ($tag_xy) does not match EIIS_VERSION ($eiis_xy from $eiis_ver)" >&2
            exit 1
          fi

      - name: Bundle conformance checker
        run: |
          tar czf eiis-conformance.tar.gz conformance/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          eiis_ver="$(cat EIIS_VERSION | tr -d '[:space:]')"
          spec_ver="$(printf '%s' "$eiis_ver" | cut -d. -f1-2)"
          spec_file="spec/eiis-${spec_ver}.md"
          test -f "$spec_file"
          # Extract the matching CHANGELOG section when possible; fall back to full file.
          notes="$(mktemp)"
          if awk -v ver="${eiis_ver}" '
            $0 ~ "^## \\[" ver "\\]" {p=1; print; next}
            p && /^## \\[/ {exit}
            p {print}
          ' CHANGELOG.md > "$notes" && [ -s "$notes" ]; then
            :
          else
            cp CHANGELOG.md "$notes"
          fi
          gh release create "$tag" \
            --title "EIIS v${eiis_ver}" \
            --notes-file "$notes" \
            "$spec_file" \
            "SPEC.md" \
            "contract/eiis-${spec_ver}.yaml" \
            "eiis-conformance.tar.gz"
