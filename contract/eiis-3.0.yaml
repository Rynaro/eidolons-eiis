version: 3.0.0
package_schema: schemas/package-manifest.v3.json
receipt_schema: schemas/install-receipt.v1.json
entrypoints:
  persona: PERSONA.md
  spec: SPEC.md
  skill: skills/*/SKILL.md
forbidden_package_paths:
  - agent.md
  - EIDOLONS.md
adapter_types:
  - symlink
  - pointer
hook_events:
  - session-start
  - prompt-submit
  - pre-tool
  - stop
pointer_contract:
  max_bytes: 2048
  required_marker: "generated_by: eidolons"
  forbidden_markers:
    - "<!-- eidolon:"
package_roles:
  - persona
  - spec
  - skill
  - resource
  - hook
