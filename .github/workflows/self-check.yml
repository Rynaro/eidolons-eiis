# Nightly: run conformance/check.sh against every implementor listed
# in IMPLEMENTORS.md. Surfaces drift in the live ecosystem.
name: self-check

on:
  schedule:
    - cron: '13 4 * * *'   # 04:13 UTC daily
  workflow_dispatch:

jobs:
  implementor-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        eidolon:
          - { repo: Rynaro/ATLAS,        tag: v1.0.3 }
          - { repo: Rynaro/SPECTRA,      tag: v4.2.8 }
          - { repo: Rynaro/APIVR-Delta,  tag: v3.0.3 }
          - { repo: Rynaro/IDG,          tag: v1.1.3 }
          - { repo: Rynaro/VIGIL,        tag: v1.0.1 }
          - { repo: Rynaro/FORGE,        tag: v1.1.1 }
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq

      - name: Clone implementor at tag
        run: |
          git clone --depth=1 --branch "${{ matrix.eidolon.tag }}" \
            "https://github.com/${{ matrix.eidolon.repo }}.git" /tmp/eidolon

      - name: Run conformance checker (info-only; do not block on warnings)
        run: |
          bash conformance/check.sh /tmp/eidolon || true
          rc=$?
          echo "Implementor: ${{ matrix.eidolon.repo }}@${{ matrix.eidolon.tag }}"
          echo "Exit code: $rc"
          # The matrix continues on failure; we surface the exit codes
          # in the run summary rather than failing the whole job. Promotion
          # of D-3/D-6 to fail happens in EIIS v1.2 (target 2027-04-24).
        continue-on-error: true
